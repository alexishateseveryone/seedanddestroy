<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Seed and Destroy</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="./node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">
<link rel="preload" as="image" href="assets/images/sadmlogo.png">
<script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
</script>
<style>
  /* Swaying & Floating Animation for the Logo */
  @keyframes logoSway {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    25% {
      transform: translate(-6px, -4px) rotate(-1.5deg);
    }
    50% {
      transform: translate(0, -8px) rotate(0deg);
    }
    75% {
      transform: translate(6px, -4px) rotate(1.5deg);
    }
    100% {
      transform: translate(0, 0) rotate(0deg);
    }
  }

  .animated-logo {
    animation: logoSway 4s ease-in-out infinite;
    transform-origin: bottom center;
  }

  /* ---------- loading screen ---------- */
  #loading{position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 80% 80% at 50% 40%,#3b3e45 0,#202226 55%,#121316 100%);transition:opacity .6s ease,visibility .6s;color:#e9eaee;font-family:'Baloo 2',system-ui,sans-serif}
  #loading.out{opacity:0;visibility:hidden;pointer-events:none}
  #loading .lc{width:min(440px,86vw);text-align:center}
  #loading .llogo{display:block;width:min(440px,86vw);max-height:46vh;object-fit:contain;margin:0 auto;filter:drop-shadow(0 12px 22px rgba(0,0,0,.55));image-rendering:pixelated;-webkit-user-drag:none}
  #loading .lbar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin:26px 0 10px}
  #loading .lbar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#f0c36a,#ffe19a);box-shadow:0 0 14px rgba(240,195,106,.6)}
  #loading .lrow{display:flex;justify-content:space-between;font:500 13px 'DM Mono',monospace;letter-spacing:.08em;color:#aeb2bb}
  #loading .ltip{margin-top:22px;font:700 14px 'Baloo 2',sans-serif;color:#8d919b;min-height:20px}
  #loading.fail .lbar i{background:#e8453c;box-shadow:0 0 14px rgba(232,69,60,.6)}#loading.fail #lstep{color:#ff8a7a}
  body.loading #title,body.loading #hud{visibility:hidden}

  /* ---------- responsive: any screen size / orientation ---------- */
  html,body{margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  .panel{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));box-sizing:border-box}
  .card{max-height:94vh;max-height:94dvh;max-width:96vw;overflow:auto}
  @media (max-width:700px){.animated-logo{margin-left:0!important}#title .tbox>div:first-child{margin-left:0!important}}
  /* HUD shrinks on short screens (phones in landscape) and grows on very large ones */
  @media (max-height:520px){#hud .hud-tl,#hud .hud-tc,#hud .hud-tr{zoom:.72}#v5bar,#v5sp,#v5feed{zoom:.75}#v5pr{zoom:.8;bottom:110px!important}#banner{zoom:.7}}
  @media (max-height:400px){#hud .hud-tl,#hud .hud-tc,#hud .hud-tr{zoom:.62}#v5bar,#v5sp,#v5feed{zoom:.65}}
  @media (max-width:640px){#hud .hud-tl,#hud .hud-tc,#hud .hud-tr{zoom:.7}}
  @media (min-height:1100px) and (min-width:1800px){#hud .hud-tl,#hud .hud-tc,#hud .hud-tr,#hud .hud-bc,#hud .hud-bl,#hud .hud-br{zoom:1.25}}
</style>

</head>
<body class="loading"><canvas id="c"></canvas>
<svg width="0" height="0" style="position:absolute"><symbol id="paw" viewBox="0 0 128 128"><g fill="currentColor"><ellipse cx="64" cy="82" rx="25" ry="20"/><ellipse cx="26" cy="54" rx="10" ry="13"/><ellipse cx="47" cy="34" rx="10" ry="14"/><ellipse cx="81" cy="34" rx="10" ry="14"/><ellipse cx="102" cy="54" rx="10" ry="13"/></g></symbol></svg>
<div id="loading"><div class="lc"><img class="llogo animated-logo" src="assets/images/sadmlogo.png" alt="Seed and Destroy No Mercy!" draggable="false">
  <div class="lbar"><i id="lfill"></i></div><div class="lrow"><span id="lstep">Loading…</span><span id="lpct">0%</span></div><div class="ltip" id="ltip"></div></div></div>
<script>
// Loading screen: main.js reports real steps through window.__load.set(0..1,'text') and calls done() once the game is drawing.
(function(){
  const $=id=>document.getElementById(id),root=$('loading'),fill=$('lfill'),pct=$('lpct'),step=$('lstep'),tip=$('ltip');
  const tips=['Roll (Space) to dodge bullets - you are invulnerable while tumbling.','Right click scopes with guns. The Sniper pierces through enemies.','Mouse wheel or 1-8 swaps weapons.','5v5: hold F on a site to plant the spike.','Your rank decides how good the AI cats are. Climb to face tougher ones.','Customize your cat - hood, cloak, collar, ears and coat patterns.'];
  let target=0,shown=0,finished=false,failed=false,ti=0;
  tip.textContent=tips[0];setInterval(()=>{tip.textContent=tips[ti=(ti+1)%tips.length]},2600);
  (function paint(){if(failed)return;shown+=(target-shown)*.14;if(target-shown<.002)shown=target;
    fill.style.width=(shown*100).toFixed(1)+'%';pct.textContent=Math.round(shown*100)+'%';
    if(finished&&shown>=.999){root.classList.add('out');document.body.classList.remove('loading');setTimeout(()=>root.remove(),800);return}
    requestAnimationFrame(paint)})();
  const fail=m=>{if(finished)return;failed=true;root.classList.add('fail');step.textContent=m;tip.textContent='Open the browser console (F12) to see exactly which file failed, then reload.'};
  addEventListener('error',e=>{const t=e.target;fail(t&&t.src?'Could not load '+t.src.split('/').pop():'Error: '+(e.message||'script failed'))},true);
  addEventListener('unhandledrejection',e=>fail('Error: '+((e.reason&&e.reason.message)||e.reason)));
  setTimeout(()=>{if(!finished&&!failed)tip.textContent='Still loading... if this never finishes, check the console (F12) for a missing file.'},20000);
  window.__load={set(p,t){target=Math.max(target,Math.min(1,p));if(t)step.textContent=t},done(){step.textContent='Ready!';target=1;finished=true}};
})();
</script>
<div id="hud" hidden></div>
<div id="toast"></div>

<div id="title" class="panel">
  <div class="tbox" style="align-items: flex-start; text-align: left;">
    <!-- Custom PNG Title Logo pulled further to the left -->
    <div style="width: 100%; margin-bottom: 12px; margin-left: -35px; display: flex; justify-content: flex-start;">
      <img src="assets/images/sadmlogo.png" alt="Seed and Destroy No Mercy!" class="animated-logo" style="width: 100%; max-width: 460px; height: auto; filter: drop-shadow(0 12px 22px rgba(0,0,0,0.55)); image-rendering: pixelated;">
    </div>

    <div class="rkpill" id="rkpill"></div>
    <div class="best">BEST <b id="bestT">0</b></div>
    <button id="play" class="btn green"><svg class="ic"><use href="#paw"/></svg>Play</button>
    <button id="play5" class="btn red"><svg class="ic"><use href="#paw"/></svg>5v5 Spike Rush</button>
    <button id="make" class="btn pink"><svg class="ic"><use href="#paw"/></svg>Customize Cat</button>
    <button id="gfxOpen" class="btn gold"><i class="bi bi-gear-fill" style="font-size:22px"></i>Settings</button>
    <p class="kb"><b>WASD</b> move &nbsp;·&nbsp; <b>Mouse</b> aim<br><b>Left click</b> shoot / slash &nbsp;·&nbsp; <b>Right click</b> scope<br><b>Space</b> roll &nbsp;·&nbsp; <b>1-8 / wheel</b> weapon &nbsp;·&nbsp; <b>Esc</b> pause &nbsp;·&nbsp; <b>G</b> settings<br><b>5v5:</b> hold <b>F</b> to plant / defuse the spike</p>
  </div>

</div>
<div id="maker" hidden></div>
<div id="over" class="panel" hidden><div class="card"><h2>Cat Down!</h2><div class="stats"><div><b id="sW">1</b><span>Wave</span></div><div><b id="sK">0</b><span>KOs</span></div><div><b id="sS">0</b><span>Score</span></div></div><p id="best"></p>
  <div class="row"><button id="again" class="btn green">Try Again</button><button id="home" class="btn gold">Title</button></div></div></div>
<script>
// Shrinks the title menu and the popup cards so they always fit the screen (any size, any orientation).
(function(){
  const SEL='#title .tbox,.card';
  function fit(){
    const els=document.querySelectorAll(SEL);
    els.forEach(e=>e.style.zoom='');
    els.forEach(e=>{
      const r=e.getBoundingClientRect();if(!r.width||!r.height)return;
      const z=Math.min(1,(innerHeight*.94)/r.height,(innerWidth*.96)/r.width);
      if(z<.999)e.style.zoom=z.toFixed(3);
    });
  }
  let q=0;const later=()=>{cancelAnimationFrame(q);q=requestAnimationFrame(fit)};
  addEventListener('resize',later);addEventListener('orientationchange',()=>setTimeout(later,200));addEventListener('load',later);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(later);
  new MutationObserver(later).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['hidden']});
  document.querySelectorAll('img').forEach(i=>i.addEventListener('load',later));
  later();
})();
</script>
<script type="module" src="main.js"></script></body></html>
