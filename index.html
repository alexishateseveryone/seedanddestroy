<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Seed and Destroy</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800;900&family=Bungee&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
  /* Swaying & Floating Animation for the Logo */
  @keyframes logoSway {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    25% {
      transform: translate(-6px, -4px) rotate(-1.5deg);
    }
    50% {
      transform: translate(0, -8px) rotate(0deg);
    }
    75% {
      transform: translate(6px, -4px) rotate(1.5deg);
    }
    100% {
      transform: translate(0, 0) rotate(0deg);
    }
  }

  .animated-logo {
    animation: logoSway 4s ease-in-out infinite;
    transform-origin: bottom center;
  }
</style>
</head>
<body><canvas id="c"></canvas>
<svg width="0" height="0" style="position:absolute"><symbol id="paw" viewBox="0 0 128 128"><g fill="currentColor"><ellipse cx="64" cy="82" rx="25" ry="20"/><ellipse cx="26" cy="54" rx="10" ry="13"/><ellipse cx="47" cy="34" rx="10" ry="14"/><ellipse cx="81" cy="34" rx="10" ry="14"/><ellipse cx="102" cy="54" rx="10" ry="13"/></g></symbol></svg>
<div id="hud" hidden></div>
<div id="toast"></div>

<div id="title" class="panel">
  <div class="tbox" style="align-items: flex-start; text-align: left;">
    <!-- Custom PNG Title Logo pulled further to the left -->
    <div style="width: 100%; margin-bottom: 12px; margin-left: -35px; display: flex; justify-content: flex-start;">
      <img src="assets/images/sadmlogo.png" alt="Seed and Destroy No Mercy!" class="animated-logo" style="width: 100%; max-width: 460px; height: auto; filter: drop-shadow(0 12px 22px rgba(0,0,0,0.55)); image-rendering: pixelated;">
    </div>

    <div class="best">BEST <b id="bestT">0</b></div>
    <button id="play" class="btn green"><svg class="ic"><use href="#paw"/></svg>Play</button>
    <button id="make" class="btn pink"><svg class="ic"><use href="#paw"/></svg>Customize Cat</button>
    <p class="kb"><b>WASD</b> move &nbsp;·&nbsp; <b>Mouse</b> aim<br><b>Left click</b> shoot / slash &nbsp;·&nbsp; <b>Right click</b> scope<br><b>Space</b> roll &nbsp;·&nbsp; <b>1-8 / wheel</b> weapon &nbsp;·&nbsp; <b>Esc</b> pause</p>
  </div>

</div>
<div id="maker" hidden></div>
<div id="over" class="panel" hidden><div class="card"><h2>Cat Down!</h2><div class="stats"><div><b id="sW">1</b><span>Wave</span></div><div><b id="sK">0</b><span>KOs</span></div><div><b id="sS">0</b><span>Score</span></div></div><p id="best"></p>
  <div class="row"><button id="again" class="btn green">Try Again</button><button id="home" class="btn gold">Title</button></div></div></div>
<script type="module" src="main.js"></script></body></html>
